name: compose-oci

on:
  workflow_call:
    inputs:
      compose-folder:
        description: Folder containing the Docker Compose files to publish
        required: false
        type: string
        default: deployment/compose

jobs:
  compose-oci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare Docker Compose artifacts
        id: prepare-compose
        shell: bash
        env:
          COMPOSE_FOLDER: ${{ inputs.compose-folder }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          compose_files=$(find "${COMPOSE_FOLDER}" -maxdepth 1 -type f -name 'docker-compose*.yml' 2>/dev/null | sort)
          if [[ -n "${compose_files}" ]]; then
            slug=$(echo "${REF_NAME}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            echo "compose-exists=true"
            echo "tag=${slug}"
          else
            echo "compose-exists=false"
          fi >> "${GITHUB_OUTPUT}"
      - name: Log in to GitHub Container Registry
        if: ${{ steps.prepare-compose.outputs.compose-exists == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker Compose artifacts
        if: ${{ steps.prepare-compose.outputs.compose-exists == 'true' }}
        env:
          COMPOSE_FOLDER: ${{ inputs.compose-folder }}
          IMAGE_TAG: ${{ steps.prepare-compose.outputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/compose"
          while IFS= read -r compose_file; do
            artifact_tag=${IMAGE_TAG}
            filename=${compose_file##*/}
            if [[ "${filename}" != "docker-compose.yml" ]]; then
              suffix=${filename#docker-compose.}
              suffix=${suffix%.yml}
              artifact_tag="${IMAGE_TAG}-${suffix}"
            fi
            docker compose -f "${compose_file}" publish --with-env --yes "${image}:${artifact_tag}"
          done < <(find "${COMPOSE_FOLDER}" -maxdepth 1 -type f -name 'docker-compose*.yml' | sort)
