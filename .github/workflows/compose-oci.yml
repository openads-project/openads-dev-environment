name: compose-oci

on:
  workflow_call:
    inputs:
      compose-file:
        description: Path to the Docker Compose file to publish
        required: false
        type: string
        default: deployment/compose/docker-compose.yml
      image-name:
        description: Image name to publish the Docker Compose artifact to
        required: false
        type: string
        default: ghcr.io/${{ github.repository }}/compose
      image-tag:
        description: Image tag to publish the Docker Compose artifact to
        required: false
        type: string
        default: ${{ github.head_ref || github.ref_name }}

jobs:
  compose-oci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check Docker Compose file
        id: check-compose
        shell: bash
        run: |
          compose_file="${{ inputs.compose-file }}"
          if [[ -f "${compose_file}" ]]; then
            compose_files=${compose_file}
          elif [[ "${compose_file}" == "deployment/compose/docker-compose.yml" ]]; then
            compose_files=$(find deployment/compose -maxdepth 1 -type f -name 'docker-compose.*.yml' 2>/dev/null | sort | tr '\n' ' ')
          else
            compose_files=
          fi
          if [[ -n "${compose_files}" ]]; then
            echo "compose-exists=true"
            echo "compose-files=${compose_files}"
          else
            echo "compose-exists=false"
          fi >> "${GITHUB_OUTPUT}"
      - name: Slugify ref name
        if: ${{ steps.check-compose.outputs.compose-exists == 'true' }}
        id: slugify-ref-name
        shell: bash
        run: |
          slug=$(echo "${{ inputs.image-tag }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "slug=${slug}" >> "${GITHUB_OUTPUT}"
      - name: Prepare artifact tag
        if: ${{ steps.check-compose.outputs.compose-exists == 'true' }}
        id: artifact
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          compose_file="${{ inputs.compose-file }}"
          echo "compose-file=${compose_file}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE_NAME,,}" >> "${GITHUB_OUTPUT}"
          echo "tag=${{ steps.slugify-ref-name.outputs.slug }}" >> "${GITHUB_OUTPUT}"
      - name: Log in to GitHub Container Registry
        if: ${{ steps.check-compose.outputs.compose-exists == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker Compose artifact
        if: ${{ steps.check-compose.outputs.compose-exists == 'true' }}
        env:
          COMPOSE_FILES: ${{ steps.check-compose.outputs.compose-files }}
          IMAGE: ${{ steps.artifact.outputs.image }}
          IMAGE_TAG: ${{ steps.artifact.outputs.tag }}
        run: |
          for compose_file in ${COMPOSE_FILES}; do
            artifact_tag=${IMAGE_TAG}
            if [[ "${compose_file}" != "${{ steps.artifact.outputs.compose-file }}" ]]; then
              filename=${compose_file##*/}
              suffix=${filename#docker-compose.}
              suffix=${suffix%.yml}
              artifact_tag="${IMAGE_TAG}-${suffix}"
            fi
            docker compose -f "${compose_file}" \
              publish --with-env --yes "${IMAGE}:${artifact_tag}"
          done
