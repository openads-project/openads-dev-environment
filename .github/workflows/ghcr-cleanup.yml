name: ghcr-cleanup

on:
  workflow_call:
    inputs:

jobs:
  ghcr-cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Cleanup ${{ github.repository }}
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          packages: ${{ github.repository }}
          dry-run: true # TODO: false
          use-regex: true
          delete-tags: ".*_ci.*"
          exclude-tags: "^v[0-9]+.[0-9]+.[0-9]+"
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          validate: true
      - name: Cleanup ${{ github.repository }}/compose
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          packages: ${{ github.repository }}/compose
          dry-run: true # TODO: false
          use-regex: true
          delete-tags: ".*"
          exclude-tags: "^v[0-9]+.[0-9]+.[0-9]+"
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          validate: true
      - name: Cleanup ${{ github.repository }}/helm
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          packages: ${{ github.repository }}/helm
          dry-run: true # TODO: false
          use-regex: true
          delete-tags: ".*"
          exclude-tags: "^v[0-9]+.[0-9]+.[0-9]+"
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          validate: true
