name: ghcr-cleanup

on:
  workflow_call:
    inputs: {}

jobs:
  ghcr-cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Determine package names
        id: package
        shell: bash
        run: |
          helm_packages=
          while IFS= read -r chart_file; do
            chart_name=$(sed -nE 's/^name:[[:space:]]*([^[:space:]#]+).*$/\1/p' "${chart_file}")
            [[ -n "${chart_name}" ]] || continue
            helm_package="${{ github.event.repository.name }}/helm/${chart_name}"
            helm_packages="${helm_packages:+${helm_packages},}${helm_package}"
          done < <(find deployment/helm -mindepth 1 -maxdepth 2 -type f -name Chart.yaml 2>/dev/null | sort)
          echo "helm_packages=${helm_packages}" >> "$GITHUB_OUTPUT"
      - name: Cleanup ${{ github.repository }}
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          packages: ${{ github.event.repository.name }}
          dry-run: false
          use-regex: true
          skip-regex-checks: true
          older-than: 1 month
          exclude-tags: '^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$' # v1.2.3, v1.2.3-dev, v1.2.3-*
          delete-tags: ".*_ci.*"
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          validate: true
      - name: Cleanup ${{ github.repository }}/compose
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          packages: ${{ github.event.repository.name }}/compose
          dry-run: false
          use-regex: true
          skip-regex-checks: true
          older-than: 1 month
          exclude-tags: '^(v[0-9]+\.[0-9]+\.[0-9]+|main)$' # v1.2.3, main
          delete-tags: ".*"
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          validate: true
      - name: Cleanup Helm charts
        if: ${{ steps.package.outputs.helm_packages != '' }}
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          packages: ${{ steps.package.outputs.helm_packages }}
          dry-run: false
          use-regex: true
          skip-regex-checks: true
          older-than: 1 month
          exclude-tags: '^[0-9]+\.[0-9]+\.[0-9]+(-main)?$' # 1.2.3, 1.2.3-main
          delete-tags: ".*"
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          validate: true
