name: ghcr-cleanup

on:
  workflow_call:
    inputs:
      images:
        description: Comma-separated images below the repository package, for example `server,client` for `<repo>/server` and `<repo>/client`. The repository package itself is always cleaned.
        required: false
        type: string
        default: ""
      cleanup-compose:
        description: Clean the Compose packages, github.repository/compose[/<deployment>]
        required: false
        type: boolean
        default: true
      cleanup-helm:
        description: Clean the Helm packages, github.repository/helm/<chart>
        required: false
        type: boolean
        default: true

jobs:
  ghcr-cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Determine package names
        id: package
        shell: bash
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          repository_name='${{ github.event.repository.name }}'
          repository_name=${repository_name,,}

          image_packages=${repository_name}
          IFS=',' read -ra images <<< "${IMAGES}"
          for image in "${images[@]}"; do
            image=${image//[[:space:]]/}
            if [[ -n "${image}" ]]; then
              image_packages="${image_packages},${repository_name}/${image}"
            fi
          done

          # docker-compose.yml -> <repo>/compose, docker-compose.<deployment>.yml -> <repo>/compose/<deployment>
          compose_packages=
          while IFS= read -r compose_file; do
            filename=${compose_file##*/}
            package=${repository_name}/compose
            if [[ "${filename}" != "docker-compose.yml" ]]; then
              deployment=${filename#docker-compose.}
              deployment=${deployment%.yml}
              deployment=${deployment//_/-}
              package="${package}/${deployment,,}"
            fi
            compose_packages="${compose_packages:+${compose_packages},}${package}"
          done < <(find deployment/compose -maxdepth 1 -type f -name 'docker-compose*.yml' 2>/dev/null | sort)

          # helm push appends the chart name: <repo>/helm/<chart>
          helm_packages=
          while IFS= read -r chart_name; do
            helm_packages="${helm_packages:+${helm_packages},}${repository_name}/helm/${chart_name}"
          done < <(find deployment/helm -mindepth 1 -maxdepth 2 -type f -name Chart.yaml 2>/dev/null | sort | xargs -r sed -nE 's/^name:[[:space:]]*([^[:space:]#]+).*$/\1/p' | sort -u)

          {
            echo "image_packages=${image_packages}"
            echo "compose_packages=${compose_packages}"
            echo "helm_packages=${helm_packages}"
          } >> "$GITHUB_OUTPUT"
      - name: Cleanup ${{ steps.package.outputs.image_packages }}
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          packages: ${{ steps.package.outputs.image_packages }}
          dry-run: false
          use-regex: true
          skip-regex-checks: true
          older-than: 1 month
          exclude-tags: '^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$' # v1.2.3, v1.2.3-dev, v1.2.3-*
          delete-tags: ".*_ci.*"
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          validate: true
      - name: Cleanup ${{ steps.package.outputs.compose_packages }}
        if: ${{ inputs['cleanup-compose'] && steps.package.outputs.compose_packages != '' }}
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          packages: ${{ steps.package.outputs.compose_packages }}
          dry-run: false
          use-regex: true
          skip-regex-checks: true
          older-than: 1 month
          exclude-tags: '^(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+\.[0-9]+\.[0-9]+)?|main)$' # v1.2.3, v1.2.3-4.5.6, main
          delete-tags: ".*"
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          validate: true
      - name: Cleanup ${{ steps.package.outputs.helm_packages }}
        if: ${{ inputs['cleanup-helm'] && steps.package.outputs.helm_packages != '' }}
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          packages: ${{ steps.package.outputs.helm_packages }}
          dry-run: false
          use-regex: true
          skip-regex-checks: true
          older-than: 1 month
          exclude-tags: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+\.[0-9]+\.[0-9]+)?(-main)?$' # 1.2.3, 1.2.3-4.5.6, *-main
          delete-tags: ".*"
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          validate: true
